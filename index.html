<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생명탐험대: 몸의 비밀을 찾아라!</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf6f4;--card:#fff;--ink:#0f2f3a;--sub:#4a6b73;--teal:#1f8a8a;--yel:#ffcf3d;--cor:#ef5d4a;--ok:#1d9b62;--line:#bfdcd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2227;--card:#14343b;--ink:#eaf6f4;--sub:#9cc0c4;--teal:#4fc3c3;--line:#2a5159}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6}
h1,h2,h3,.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.top .tn{font-family:'Jua',sans-serif;font-size:20px}
.pill{background:var(--yel);color:#3a2b00;border-radius:99px;padding:4px 14px;font-family:'Jua',sans-serif;font-size:18px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--teal);transition:width .4s}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
h1{font-size:38px;line-height:1.2;margin:8px 0}h2{font-size:26px;margin:0 0 8px}h3{font-size:20px;margin:0 0 6px}
.sub{color:var(--sub)}
button{font:inherit;cursor:pointer}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-family:'Jua',sans-serif;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.4;cursor:default}
.btn.y{background:var(--yel);color:#3a2b00}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.sel{border-color:var(--teal);background:rgba(31,138,138,.12)}
.opt.good{border-color:var(--ok);background:rgba(29,155,98,.16)}
.opt.bad{border-color:var(--cor);background:rgba(239,93,74,.14)}
.role{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.role span{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:3px 10px;font-size:14px}
.role b{color:var(--teal)}
.fb{border-radius:12px;padding:12px 14px;margin-top:10px;font-size:16px}
.fb.good{background:rgba(29,155,98,.16)}.fb.bad{background:rgba(239,93,74,.14)}
input[type=text],input[type=number]{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card);color:var(--ink);font-size:16px}
.chip.used{opacity:.3}.chip.shake{animation:sh .3s;border-color:var(--cor)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{list-style:none;padding:0;margin:10px 0}
.slots li{border:2px dashed var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;min-height:46px}
.slots li.f{border-style:solid;border-color:var(--ok);background:rgba(29,155,98,.12)}
.oxrow{display:flex;gap:12px;margin:12px 0}.oxrow .btn{flex:1;font-size:34px}
.ev{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:15px;flex-wrap:wrap}.ev input[type=text]{width:130px}
.tag{display:inline-block;font-family:'Jua',sans-serif;background:var(--cor);color:#fff;border-radius:8px;padding:1px 10px;font-size:15px;margin-bottom:6px}
.rank{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0}
.row3{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const ROLES=['🔍 자료탐정','✍️ 기록관','🎤 발표대장','🧭 팩트체커','⏱ 시간지기'];
const Q1=[
{q:'정자가 만들어지는 곳은 어디일까?',o:['난소','고환(정소)','전립선','방광'],a:1,e:'정자는 고환(정소)에서 만들어져요. 난소는 난자가 만들어지고 성숙하는 곳이에요.'},
{q:'수정은 보통 어디에서 일어날까?',o:['난관(나팔관)','질','방광','자궁 입구 밖'],a:0,e:'난자와 정자가 만나 수정되는 곳은 보통 난관이에요. 수정란은 난관을 지나 자궁으로 이동해요.'},
{q:'수정란이 자궁 내막에 자리를 잡는 것을 무엇이라고 할까?',o:['배란','사정','착상','월경'],a:2,e:'수정란이 자궁 내막에 자리 잡는 것을 착상이라고 해요. 착상이 되면 임신이 시작돼요.'},
{q:'월경(생리)에 대한 설명으로 알맞은 것은?',o:['병에 걸려서 피가 나는 것이다','임신이 되지 않았을 때 두꺼워졌던 자궁 내막이 떨어져 나오는 것이다','소변과 함께 나오는 것이다','모든 사람이 28일 주기로 한다'],a:1,e:'월경은 자연스러운 몸의 변화예요. 주기는 사람마다 다르고, 사춘기 초기에는 불규칙할 수도 있어요.'},
{q:'몽정에 대한 설명으로 알맞은 것은?',o:['잘못된 행동을 해서 생기는 일이다','잠자는 동안 정액이 몸 밖으로 나오는 자연스러운 현상이다','병이라서 치료가 필요하다','일부러 조절할 수 있다'],a:1,e:'몽정은 사춘기에 나타나는 자연스러운 현상이에요. 부끄러워하거나 죄책감을 느낄 일이 아니에요.'},
{q:'발기에 대한 설명으로 알맞은 것은?',o:['음경에 혈액이 모여 단단해지는 자연스러운 몸의 반응이다','반드시 나쁜 생각을 해야 생긴다','병이라서 병원에 가야 한다','나이와 상관없이 절대 일어나지 않는다'],a:0,e:'발기는 자연스러운 신체 반응이에요. 사춘기에는 상황과 상관없이 일어나기도 해요.'}
];
const PZ=[
{t:'🤰 임신의 여정',s:['배란 (난소에서 난자가 나옴)','수정 (난자와 정자가 만남)','수정란이 난관을 지나 자궁으로 이동','착상 (자궁 내막에 자리 잡음)','태아가 자람','출산']},
{t:'🌙 월경 주기',s:['자궁 내막이 점점 두꺼워짐','배란이 일어남','임신이 되지 않음','두꺼워진 내막이 떨어져 나옴 (월경)']}
];
const MY=[
{q:'생리 중에는 운동이나 체육 수업을 절대 하면 안 된다.',a:false,e:'❌ 대부분 평소처럼 활동해도 괜찮아요. 몸이 많이 힘들면 쉬어도 돼요.'},
{q:'생리통이 심해도 무조건 참아야 한다.',a:false,e:'❌ 일상생활이 힘들 만큼 아프면 보건 선생님, 보호자, 병원에 도움을 청해야 해요.'},
{q:'몽정이나 발기는 부끄럽고 이상한 일이다.',a:false,e:'❌ 사춘기에 나타나는 자연스러운 몸의 변화예요.'},
{q:'생리 주기는 모든 사람이 똑같이 28일이다.',a:false,e:'❌ 사람마다, 시기마다 달라요. 사춘기 초기에는 특히 불규칙할 수 있어요.'},
{q:'사춘기가 시작되는 시기는 사람마다 다르다.',a:true,e:'⭕ 빠른 친구도, 느린 친구도 있어요. 비교할 필요가 없어요.'},
{q:'친구의 몸 변화를 놀리는 것은 장난이어도 존중이 아니다.',a:true,e:'⭕ 상대가 불쾌하다면 장난이 아니에요. 몸은 놀림감이 아니에요.'}
];
const SIT=[
{q:'수업 시간에 친구가 당황한 얼굴로 생리를 시작한 것 같다고 조용히 말한다. 가장 좋은 도움은?',o:['큰 소리로 "야, 쟤 생리한대!"라고 알린다','다른 친구들이 모르게 함께 보건실에 가거나 선생님께 조용히 도움을 요청한다','모른 척한다','웃으면서 사진을 찍는다'],a:1,e:'당황한 친구의 사생활을 지켜주고, 필요한 도움을 조용히 연결하는 것이 존중이에요.'},
{q:'누가 내 몸에 대해 불쾌한 농담을 했다. 가장 좋은 대응은?',o:['같이 웃어 넘긴다','"그 말은 기분 나빠. 하지 마."라고 분명히 말한다','똑같이 되갚아 준다','혼자 참는다'],a:1,e:'불쾌함을 분명한 말로 표현하는 것은 내 몸을 지키는 일이에요. 반복되면 믿을 수 있는 어른에게 꼭 알려요.'},
{q:'싫다고 했는데도 신체 접촉을 계속하는 사람이 있다. 어떻게 해야 할까?',o:['내가 예민한 거라고 생각하고 참는다','그 자리를 피하고, 보호자·담임·보건 선생님 같은 믿을 수 있는 어른에게 알린다','비밀로 하자는 말을 지킨다','소문을 낸다'],a:1,e:'내 몸의 주인은 나예요. 비밀로 하자는 요구는 따르지 않아도 돼요. 도움이 필요하면 청소년전화 1388에도 연락할 수 있어요.'}
];
const STEPS=[{n:'단서 사냥',i:'📚'},{n:'순서 퍼즐',i:'🧩'},{n:'속설 격파',i:'🔍'},{n:'최종 미션',i:'🚨'}];
const S={team:'',members:[],score:0,stage:'intro',round:0,idx:0,log:{ev:0,first:0,retry:0}};
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function roleHtml(){if(!S.members.length)return'';const n=S.members.length;let h='<div class="role">';ROLES.slice(0,Math.max(n,3)).forEach((r,k)=>{h+=`<span>${r}: <b>${esc(S.members[(S.idx+k)%n])}</b></span>`});if(n===3)h+='<span>🧭 팩트체커는 모두가 함께!</span>';return h+'</div>'}
function head(){const total=STEPS.length;const p=Math.round(S.round/total*100);return `<div class="top"><div class="tn">🧭 ${esc(S.team)}</div><div class="pill">⭐ ${S.score}점</div></div><div class="bar"><i style="width:${p}%"></i></div>`}
function add(n){S.score+=n}
function intro(){
$.innerHTML=`<div class="card"><div class="tag">모둠 탐험 게임</div><h1>🧬 생명탐험대<br>몸의 비밀을 찾아라!</h1><p class="sub">모둠이 한 팀이 되어 책에서 단서를 찾고, 퀴즈·퍼즐·미션을 풀어요. 컴퓨터는 모둠당 1대만 사용해요.</p></div>
<div class="card"><h3>탐험대 만들기</h3><label class="sub">탐험대 이름</label><input type="text" id="tm" placeholder="예: 별빛탐험대" maxlength="12">
<p class="sub" style="margin-bottom:4px">대원 이름 (3~5명)</p><div class="grid">${[0,1,2,3,4].map(i=>`<input type="text" class="mb" placeholder="대원 ${i+1}${i<3?'':' (선택)'}" maxlength="6">`).join('')}</div></div>
<div class="card"><h3>탐험 약속</h3><p>① 비웃거나 놀리지 않기 ② 친구의 개인 경험을 묻지 않기 ③ 정확한 용어 쓰기 ④ 모르면 책에서 찾기</p>
<p class="sub">⭐ 한 번에 맞히면 +3, 두 번째에 맞히면 +1. 💀 킬러 문항은 +2 보너스!</p></div>
<button class="btn" id="go">탐험 출발!</button><p id="er" style="color:var(--cor)"></p>`;
document.getElementById('go').onclick=()=>{const t=document.getElementById('tm').value.trim();const m=[...document.querySelectorAll('.mb')].map(x=>x.value.trim()).filter(Boolean);
if(!t||m.length<3){document.getElementById('er').textContent='탐험대 이름과 대원 3명 이상을 입력해 주세요.';return}
S.team=t;S.members=m;S.round=0;S.idx=0;rounds()}}
function banner(i,txt){$.innerHTML=head()+`<div class="card" style="text-align:center"><div style="font-size:64px">${STEPS[i].i}</div><h2>${i+1}라운드. ${STEPS[i].n}</h2><p>${txt}</p><button class="btn y" id="st">시작하기</button></div>`;document.getElementById('st').onclick=()=>[q1,pz,my,sit][i](0)}
function rounds(){if(S.round>=STEPS.length)return end();banner(S.round,['모둠이 의논해서 정답을 골라요. 헷갈리면 교과서·성교육 도서를 펼쳐 확인하세요!','섞여 있는 카드를 올바른 순서대로 눌러요.','진짜일까 가짜일까? 모둠이 토의하고 ⭕/❌를 골라요. 책에서 근거를 찾아보세요.','생활 속 상황에서 가장 존중하는 행동을 모둠이 함께 골라요.'][S.round])}
function next(k,arr,fn){S.idx=k+1;if(k+1>=arr.length){S.round++;S.idx=0;rounds()}else fn(k+1)}
function mcq(k,arr,fn,tagTxt,evid){
const it=arr[k];let tries=0,done=false;S.idx=k;
$.innerHTML=head()+`<div class="card"><div class="tag">${tagTxt} ${k+1}/${arr.length}</div>${roleHtml()}<h2>${it.q}</h2><div id="os">${it.o.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join('')}</div><div id="fb"></div></div>`;
$.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done||b.disabled)return;tries++;const i=+b.dataset.i;const fb=document.getElementById('fb');
if(i===it.a){done=true;b.classList.add('good');const pts=tries===1?3:tries===2?1:0;add(pts);if(tries===1)S.log.first++;else S.log.retry++;
fb.innerHTML=`<div class="fb good">🎉 정답! ${pts?'+'+pts+'점':''}<br>${it.e}</div>`+(evid?`<div class="ev"><label>📖 책에서 찾은 근거 쪽수:</label><input type="text" id="pg" placeholder="예: 85쪽"><button class="btn y" id="evb" style="font-size:16px;padding:6px 14px">+2점 받기</button></div><p class="sub" style="font-size:13px">쪽수를 적으면 선생님이 확인해요.</p>`:'')+`<p><button class="btn" id="nx">다음</button></p>`;
if(evid)document.getElementById('evb').onclick=function(){const v=document.getElementById('pg').value.trim();if(v){add(2);S.log.ev++;this.disabled=true;document.querySelector('.pill').textContent='⭐ '+S.score+'점'}};
document.getElementById('nx').onclick=()=>next(k,arr,fn)}
else{b.classList.add('bad');b.disabled=true;if(tries>=3){fb.innerHTML=''}fb.innerHTML=`<div class="fb bad">🤔 아쉬워요! 책을 다시 찾아보고 모둠이 다시 의논해 보세요.</div>`}
document.querySelector('.pill').textContent='⭐ '+S.score+'점'})}
function q1(k){mcq(k,Q1,q1,'단서',false)}
function sit(k){mcq(k,SIT,sit,'상황',false)}
function pz(k){
const p=PZ[k];S.idx=k;let order=p.s.map((t,i)=>({t,i}));order.sort(()=>Math.random()-.5);let cur=0,miss=0;
$.innerHTML=head()+`<div class="card"><div class="tag">퍼즐 ${k+1}/${PZ.length}</div>${roleHtml()}<h2>${p.t}</h2><p class="sub">처음 일어나는 일부터 차례대로 눌러요.</p><ol class="slots" id="sl">${p.s.map(()=>'<li></li>').join('')}</ol><div class="chips" id="ch">${order.map(o=>`<button class="chip" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div><div id="fb"></div></div>`;
$.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(c.classList.contains('used'))return;
if(+c.dataset.i===cur){const li=document.querySelectorAll('#sl li')[cur];li.textContent=c.textContent;li.classList.add('f');c.classList.add('used');cur++;
if(cur===p.s.length){const pts=miss===0?5:miss<=2?3:1;add(pts);document.getElementById('fb').innerHTML=`<div class="fb good">🧩 완성! ${miss===0?'한 번도 틀리지 않았어요! ':''}+${pts}점</div><p><button class="btn" id="nx">다음</button></p>`;document.querySelector('.pill').textContent='⭐ '+S.score+'점';document.getElementById('nx').onclick=()=>next(k,PZ,pz)}}
else{miss++;c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}})}
function my(k){
const m=MY[k];S.idx=k;let done=false;
$.innerHTML=head()+`<div class="card"><div class="tag">속설 ${k+1}/${MY.length}</div>${roleHtml()}<h2>“${m.q}”</h2><p class="sub">모둠이 토의한 뒤 답을 눌러요. 책에서 근거를 찾으면 더 좋아요!</p><div class="oxrow"><button class="btn" data-v="1">⭕</button><button class="btn" data-v="0" style="background:var(--cor)">❌</button></div><div id="fb"></div></div>`;
