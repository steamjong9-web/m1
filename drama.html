<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생명탐험대 2차시: 상황극 스튜디오</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf4e7;--card:#fff;--ink:#2b2433;--sub:#6e6577;--pu:#7a4fd0;--yel:#ffcf3d;--cor:#ef5d4a;--ok:#1d9b62;--line:#e6d9c6}
@media (prefers-color-scheme:dark){:root{--bg:#1d1827;--card:#2a2338;--ink:#f4eefc;--sub:#b8abc9;--pu:#a98bf0;--line:#463a5c}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400}h1{font-size:36px;margin:6px 0}h2{font-size:25px;margin:0 0 8px}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.sub{color:var(--sub)}.tag{display:inline-block;font-family:'Jua';background:var(--pu);color:#fff;border-radius:8px;padding:1px 12px;margin-bottom:6px}
button{font:inherit;cursor:pointer}
.btn{background:var(--pu);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-family:'Jua';font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.25);margin:3px}
.btn:active{transform:translateY(3px);box-shadow:none}.btn.y{background:var(--yel);color:#3a2b00}.btn.c{background:var(--cor)}.btn:disabled{opacity:.4}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:17px}
.opt.good{border-color:var(--ok);background:rgba(29,155,98,.16)}.opt.bad{border-color:var(--cor);background:rgba(239,93,74,.14)}
input[type=text]{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.pill{background:var(--yel);color:#3a2b00;border-radius:99px;padding:3px 14px;font-family:'Jua';font-size:18px}
.stage{background:linear-gradient(#efe4ff,#e2d3fb);border-radius:14px;padding:12px;min-height:150px;color:#2b2433}
.speak{display:flex;gap:10px;align-items:flex-start;margin:8px 0;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bub{background:#fff;border:2px solid #cdbbf0;border-radius:14px;padding:8px 12px;flex:1;font-size:17px;color:#2b2433}
.bub b{display:block;font-family:'Jua';font-weight:400;color:#7a4fd0;font-size:15px}
.chip{display:inline-block;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:2px 10px;margin:2px;font-size:14px}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px}.fb.good{background:rgba(29,155,98,.16)}.fb.bad{background:rgba(239,93,74,.14)}
.line{display:flex;gap:10px;align-items:flex-start;border-bottom:1px dashed var(--line);padding:8px 0}.line .who{min-width:92px;text-align:center;font-size:13px}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
#tm{font-family:'Jua';font-size:34px}.hurry{color:var(--cor);animation:hr .5s infinite}@keyframes hr{50%{transform:scale(1.15)}}
label.ck{display:block;padding:8px 10px;border:2px solid var(--line);border-radius:10px;margin:6px 0;font-size:17px}
.conf{position:fixed;top:-14px;width:10px;height:14px;z-index:99;pointer-events:none;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style></head><body><div class="wrap" id="app"></div>
<script>
// ★ 장면별 영상이 있으면 주소를 넣으세요. 예) {1:'videos/s1.mp4', 2:'https://www.youtube.com/embed/영상ID'}  없으면 만화형 컷신이 나와요.
const VIDEO={};

const NM={보건샘:'보건 선생님',낯선계정:'모르는 계정'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mouth={happy:'M20 38Q30 48 40 38',worry:'M21 44Q30 36 39 44',smirk:'M22 40Q32 44 40 36',angry:'M21 44Q30 38 39 44',calm:'M22 40H38'};
const ear=n=>{const c=CH[n];return {토끼:`<ellipse cx="20" cy="9" rx="5" ry="12" fill="${c}"/><ellipse cx="40" cy="9" rx="5" ry="12" fill="${c}"/>`,여우:`<path d="M9 24L13 2L28 13ZM51 24L47 2L32 13Z" fill="${c}"/>`,하마:`<circle cx="13" cy="15" r="6" fill="${c}"/><circle cx="47" cy="15" r="6" fill="${c}"/>`,보건샘:'<rect x="19" y="3" width="22" height="11" rx="4" fill="#fff" stroke="#bbb"/><path d="M30 5v7M26.5 8.5h7" stroke="#e33" stroke-width="2"/>'}[n]||''};
const face=(n,m='calm',w=60)=>`<svg viewBox="0 0 60 60" width="${w}">${ear(n)}<circle cx="30" cy="32" r="23" fill="${CH[n]}"/><circle cx="21" cy="28" r="3" fill="#2b2433"/><circle cx="39" cy="28" r="3" fill="#2b2433"/>${m==='angry'?'<path d="M15 20L26 24M45 20L34 24" stroke="#2b2433" stroke-width="3"/>':''}${m==='worry'?'<path d="M16 22L26 20M44 22L34 20" stroke="#2b2433" stroke-width="2.5"/>':''}<path d="${mouth[m]}" stroke="#2b2433" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
const SC=[
{t:'교실에서 갑자기 월경이 시작됐어요',sub:'수업 시간, 토끼가 하마에게 조용히 말합니다. 여우도 눈치를 챘어요.',
beats:[['토끼','worry','하마아… 나 갑자기 생리가 시작한 것 같아. 어떡하지?'],['여우','smirk','야, 토끼 얼굴이 왜 그래? 무슨 일 있어?'],['하마','calm','(토끼의 표정을 보며) 어떻게 도와주면 좋을까?']],
q:'하마의 가장 좋은 행동은?',o:['"토끼 생리한대!" 하고 큰 소리로 알린다','조용히 괜찮다고 말해 주고, 보건실에 같이 가서 도움을 요청한다','모른 척하고 앉아 있는다'],a:1,why:'월경은 자연스러운 몸의 변화예요. 친구의 사생활을 지켜 주고 필요한 도움을 연결해 주는 것이 존중이에요.',
model:[['하마','happy','괜찮아, 아무도 몰라. 나랑 같이 보건실에 가자.'],['여우','calm','무슨 일이야?'],['하마','calm','별일 아니야. 우리 잠깐 나갔다 올게.'],['보건샘','happy','잘 왔어요. 생리대가 필요하죠? 여기 있어요. 몸이 불편하면 쉬어도 돼요.'],['토끼','happy','고마워, 하마아. 네가 있어서 든든해.']],
free:'💬 자유 대사: 여우가 놀리려고 하면 하마는 어떻게 말할까요? 한 줄 만들어 보세요.'},
{t:'내 몸에 대한 불쾌한 농담',sub:'쉬는 시간, 여우가 토끼의 몸 변화를 보고 농담을 합니다.',
beats:[['여우','smirk','야 토끼, 너 요즘 몸이 많이 변했다? ㅋㅋㅋ'],['토끼','worry','…'],['하마','angry','(토끼가 불편해 보여…)']],
q:'토끼의 가장 좋은 대응은?',o:['같이 웃어 넘긴다','"그 말 기분 나빠. 내 몸으로 농담하지 마."라고 분명히 말한다','똑같이 놀려서 되갚는다'],a:1,why:'불쾌하다는 마음을 분명한 말로 표현하는 것은 내 몸을 지키는 일이에요. 반복되면 믿을 수 있는 어른에게 알려요.',
model:[['토끼','angry','그 말 기분 나빠. 내 몸 가지고 농담하지 마.'],['여우','smirk','장난인데 뭘 그래.'],['토끼','angry','나는 장난으로 안 들려. 그만해.'],['하마','calm','맞아, 그런 말은 하면 안 돼.'],['보건샘','calm','무슨 일이니? 서로 존중하는 말을 쓰자. 힘들면 언제든 선생님께 얘기하렴.']],
free:'💬 자유 대사: 여우가 계속 놀리면 토끼는 어떤 행동을 할 수 있을까요?'},
{t:'"장난이야"라며 계속되는 신체 접촉',sub:'여우가 장난이라며 토끼의 몸을 자꾸 만집니다. 토끼는 싫다고 말했어요.',
beats:[['여우','smirk','에이, 장난이야~'],['토끼','angry','싫다고 했잖아. 하지 마.'],['여우','smirk','그냥 장난인데 왜 그래?']],
q:'토끼가 해야 할 행동으로 가장 알맞은 것은?',o:['장난이니까 참는다','분명히 거절하고 자리를 피한 뒤, 믿을 수 있는 어른에게 알린다','나도 똑같이 한다'],a:1,why:'내가 싫으면 장난이 아니에요. 몸의 주인은 나이고, 거절은 언제든 할 수 있어요. 도움이 필요하면 청소년전화 1388에도 연락할 수 있어요.',
model:[['토끼','angry','싫어. 만지지 마.'],['여우','smirk','장난인데 왜 그래?'],['토끼','angry','내가 싫으면 장난이 아니야. 그만해.'],['하마','calm','토끼야, 우리 선생님께 같이 가자.'],['보건샘','calm','말해 줘서 고마워요. 네 잘못이 아니에요. 선생님이 함께 해결할게요.']],
free:'💬 자유 대사: 거절이 어려울 때 쓸 수 있는 말을 한 줄 더 만들어 보세요.'},
{t:'동의 없이 올라온 단톡방 사진',sub:'여우가 하마의 사진을 놀리는 글과 함께 단톡방에 올렸어요.',
beats:[['하마','worry','어? 내 사진이 단톡방에 올라와 있어… 놀리는 글까지!'],['여우','smirk','웃기잖아~ 다들 좋아하는데?'],['토끼','angry','(하마가 속상해 보여…)']],
q:'가장 좋은 대응 순서는?',o:['같이 웃으며 다른 사진도 올린다','화면을 캡처해 두고, 삭제를 요청한 뒤, 믿을 수 있는 어른에게 알린다','혼자 참고 아무에게도 말하지 않는다'],a:1,why:'동의 없이 사진이나 글을 퍼뜨리는 것은 피해를 주는 행동이고, 내용에 따라 법적 문제가 될 수 있어요. 증거를 남기고 어른에게 도움을 청하세요.',
model:[['하마','angry','내 동의 없이 올린 사진, 지금 삭제해 줘.'],['여우','smirk','다들 웃는데 뭘 그래.'],['토끼','angry','웃을 일이 아니야. 이건 하면 안 되는 행동이야.'],['토끼','calm','하마아, 화면부터 캡처해 두고 선생님께 같이 가자.'],['보건샘','calm','잘 알려 줬어요. 증거를 잘 남겼네요. 삭제하고 함께 해결해 봐요.']],
free:'💬 자유 대사: 단톡방 친구들에게 한마디 한다면?'},
{t:'온라인에서 모르는 사람이 사진을 요구해요',sub:'토끼에게 모르는 계정이 말을 겁니다. 하마가 옆에서 화면을 봤어요.',
beats:[['낯선계정','calm','안녕~ 너 예쁘다. 사진 한 장만 보내 줄래?'],['토끼','worry','어… 모르는 사람인데 어떡하지?'],['하마','worry','잠깐, 그거 위험한 거 아니야?']],
q:'가장 알맞은 대응은?',o:['한 장만 보낸다','단호히 거절하고 대화를 끊고 차단한 뒤, 화면을 남기고 어른이나 1388에 알린다','계속 대화하며 상대가 누군지 알아본다'],a:1,why:'내 몸 사진은 누구에게도 보내지 않아도 돼요. 거절하고 대화를 끊은 뒤 보호자·선생님·1388에 알리세요.',
model:[['토끼','angry','안 보낼 거예요. 그런 말은 하지 마세요.'],['하마','calm','바로 차단하고 화면은 캡처해 두자.'],['토끼','calm','응, 차단했어. 선생님께 알려야겠어.'],['보건샘','happy','정말 잘 대처했어요. 이런 일이 생기면 보호자나 선생님, 청소년전화 1388에 꼭 알리세요.']],
free:'💬 자유 대사: 친구가 비슷한 일을 겪는다면 어떤 말을 해 줄까요?'}];
const G={};let T={team:'',mem:[],sel:[],k:0,score:0,res:[]};
function fx(ok){try{const a=G.a||(G.a=new (window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=ok?'triangle':'sawtooth';o.frequency.value=ok?660:200;g.gain.value=.06;o.start();if(ok)o.frequency.setValueAtTime(880,a.currentTime+.12);o.stop(a.currentTime+.25)}catch(e){}
if(ok)for(let i=0;i<30;i++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=['#ffcf3d','#ef5d4a','#7a4fd0','#1d9b62'][i%4];d.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}}
function tick(h){try{const a=G.a||(G.a=new (window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='square';o.frequency.value=h?1500:850;g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.08);o.start();o.stop(a.currentTime+.09)}catch(e){}}
function clr(){clearInterval(G.t);clearInterval(G.c)}
function countdown(sec,done){clr();const t0=Date.now();let last=-1;G.t=setInterval(()=>{const l=sec-(Date.now()-t0)/1000,e=document.getElementById('tm');if(!e){clr();return}e.textContent='⏱ '+Math.max(0,Math.ceil(l));e.classList.toggle('hurry',l<=10);const k=Math.ceil(l);if(k!==last&&l>0){last=k;tick(l<=10)}if(l<=0){clr();done()}},100)}
const head=()=>`<div class="top"><b class="jua" style="font-size:20px">🎭 ${esc(T.team)}</b><span class="pill">⭐ ${T.score}점</span></div>`;
const sc=()=>SC[T.sel[T.k]];
const add=n=>{T.score+=n};
function intro(){clr();micOff();T={team:'',mem:[],sel:[],k:0,score:0,res:[]};
$('app').innerHTML=`<div class="card"><div class="tag">2차시 · 상황극 게임</div><h1>🎭 상황극 스튜디오</h1><p class="sub">컷신을 보고 → 최선의 행동을 고르고 → 대본으로 직접 연기해 보는 모둠 게임이에요. 이 화면의 이름은 저장되지 않아요.</p>
<input type="text" id="tn" placeholder="모둠 이름" maxlength="12"><p class="sub" style="margin:8px 0 4px">대원 이름 (3~5명)</p><div class="grid">${[0,1,2,3,4].map(i=>`<input type="text" class="mb" placeholder="대원 ${i+1}${i<3?'':' (선택)'}" maxlength="6">`).join('')}</div></div>
<p class="sub" style="margin:0 0 12px"><a href="index.html">← 1차시 게임으로</a></p><div class="card"><h3>오늘 도전할 상황 고르기 <small class="sub">(한 상황에 약 8~10분)</small></h3>${SC.map((s,i)=>`<label class="ck"><input type="checkbox" class="sl" value="${i}" ${i<3?'checked':''}> ${i+1}. ${s.t}</label>`).join('')}
<p class="sub">⚠️ 연기는 진지하게! 등장하는 캐릭터(토끼·하마·여우)는 가상의 동물 친구들이에요. 실제 친구를 떠올리거나 흉내 내지 않아요. 힘든 마음이 들면 언제든 그만둬도 돼요.</p></div><button class="btn" id="go">🎬 촬영 시작!</button><p id="er" style="color:var(--cor)"></p>`;
$('go').onclick=()=>{const t=$('tn').value.trim(),m=[...document.querySelectorAll('.mb')].map(x=>x.value.trim()).filter(Boolean),s=[...document.querySelectorAll('.sl:checked')].map(x=>+x.value);
if(!t||m.length<3)return $('er').textContent='모둠 이름과 대원 3명 이상을 입력해 주세요.';if(!s.length)return $('er').textContent='상황을 한 가지 이상 골라 주세요.';
T={team:t,mem:m,sel:s,k:0,score:0,res:[]};cut()}}
const $=id=>document.getElementById(id);
function cut(){clr();G.rot=null;const s=sc(),v=VIDEO[T.sel[T.k]+1];
const vid=v?(/\.(mp4|webm)$/i.test(v)?`<video src="${v}" controls style="width:100%;border-radius:12px"></video>`:`<iframe src="${v}" style="width:100%;height:380px;border:0;border-radius:12px" allowfullscreen></iframe>`):'';
